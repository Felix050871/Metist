<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MetisT">
  <g transform="rotate(-20 32 32)">
    <!-- orbita: 270 gradi, apertura netta in alto a destra -->
    <path d="M 54.6 38 A 24 17.5 0 1 1 40.2 15.6"
          fill="none" stroke="#0A46AC" stroke-width="5" stroke-linecap="round"/>
    <!-- coda: esce dall'orbita, riprende lo slancio del simbolo originale -->
    <path d="M 20 46.5 C 30 53 44 51 53 43.5"
          fill="none" stroke="#0098F0" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- monogramma mu + eta, ridotto e staccato dall'orbita -->
  <g fill="none" stroke="#0A46AC" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 27 L25 43"/>
    <path d="M25 35.5 C25 39.5 29 40 30.6 37.6 L30.6 27"/>
    <path d="M36.4 39 L36.4 30"/>
    <path d="M36.4 31.5 C37.4 28 42.6 28 42.6 31.5 L42.6 43"/>
  </g>
</svg>
